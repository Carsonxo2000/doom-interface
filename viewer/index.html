<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D.O.O.M.</title>
<style>
  :root {
    --bg: #010604;
    --green: #4ade80;
    --glow: #86efac;
    --dim: #5b6b60;
    --line: #14532d;
    --molten: #ff5a1f;
    --text: #d1d9d4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 50% 30%, #052414 0%, #020c06 55%, var(--bg) 100%),
      var(--bg);
    color: var(--text);
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(74, 222, 128, 0.035) 0 1px, transparent 1px 3px);
    z-index: 5;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  #hud svg { display: block; width: 100%; height: auto; border: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    position: relative;
    border: 1px solid var(--line);
    background: rgba(2, 10, 5, 0.85);
    padding: 10px 12px;
    min-width: 0;
  }
  .panel::before, .panel::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border: 1.5px solid var(--green);
  }
  .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  h2 {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--green);
    text-shadow: 0 0 6px rgba(74, 222, 128, 0.6);
  }
  .row { display: flex; gap: 8px; white-space: nowrap; }
  .row .t { color: var(--dim); }
  .row .tool { width: 9ch; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .row .target { flex: 1; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .row .dur { color: var(--dim); }
  .row.ok { opacity: 0.72; }
  .row.run .dur { color: var(--glow); animation: blink 1s infinite; }
  .row.err .target { color: var(--molten); }
  .file { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--dim); }
  #link {
    position: fixed;
    top: 10px;
    right: 14px;
    z-index: 6;
    font-size: 10px;
    letter-spacing: 0.18em;
    padding: 3px 8px;
    border: 1px solid var(--line);
    background: rgba(1, 6, 4, 0.8);
    color: var(--dim);
  }
  #link.live { color: var(--glow); border-color: var(--green); box-shadow: 0 0 8px rgba(74, 222, 128, 0.35); }
  #link.lost { color: var(--molten); border-color: var(--molten); }
  #await {
    display: none;
    min-height: 90vh;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 22px;
    text-align: center;
  }
  .reactor {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, #f0fff5 0 12%, var(--glow) 22%, rgba(74, 222, 128, 0.35) 45%, transparent 70%);
    box-shadow: 0 0 60px rgba(74, 222, 128, 0.35);
    position: relative;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .reactor::after {
    content: "";
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 2px dashed var(--green);
    opacity: 0.6;
    animation: spin 12s linear infinite;
  }
  .title { font: 300 28px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.4em; color: var(--glow); text-shadow: 0 0 12px rgba(134, 239, 172, 0.6); }
  .sub { color: var(--dim); letter-spacing: 0.15em; font-size: 11px; max-width: 46ch; }
  @keyframes pulse { 50% { transform: scale(0.94); opacity: 0.8; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 50% { opacity: 0.35; } }
</style>
</head>
<body>
<div id="link">LINK ▪ SEARCHING</div>

<section id="await">
  <div class="reactor"></div>
  <div class="title">D.O.O.M.</div>
  <div class="sub">AWAITING LINK. START A CLAUDE CODE SESSION ON THIS COMPUTER AND ITS ACTIVITY WILL APPEAR HERE.</div>
</section>

<main id="live" hidden>
  <div id="hud"></div>
  <div class="grid">
    <section class="panel">
      <h2>▌LEDGER OF DOOM</h2>
      <div id="log"></div>
    </section>
    <section class="panel">
      <h2>▌SEIZED TERRITORY</h2>
      <div id="files"></div>
    </section>
  </div>
</main>

<script src="hud.js"></script>
<script>
  // events.js, appended to by the plugin's hooks (scripts/doom-event), holds
  // one __e([...]) call per event. Loading it as a script works from a
  // file:// page, where fetch does not; hud.js draws the same HUD as the pane.
  const $ = id => document.getElementById(id);
  const FILE_TOOLS = new Set(['Read', 'Edit', 'Write', 'NotebookEdit', 'MultiEdit']);
  const STALE_MS = 10 * 60 * 1000;
  let events = [];
  let incoming = [];
  let shownCount = -1;
  let lastAt = 0;
  let isBusy = false;

  window.__e = ev => incoming.push(ev);

  const escHtml = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const ago = ms => {
    const s = Math.round(ms / 1000);
    return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}m` : `${Math.round(s / 3600)}h`;
  };

  // Replays the latest session's events into the pane's own shapes.
  function build(now) {
    const sid = events.length > 0 ? events[events.length - 1][1] : null;
    const byId = new Map();
    const list = [];
    const m = { calls: 0, errors: 0, turns: 0, byCat: {}, files: [], isThinking: false, turnStart: undefined };
    for (const ev of events) {
      if (ev[1] !== sid) continue;
      const [kind] = ev;
      if (kind === 'prompt') {
        m.isThinking = true;
        m.turnStart = ev[2];
        m.turns += 1;
      } else if (kind === 'stop') {
        m.isThinking = false;
        for (const b of list) if (b.status === 'run') { b.status = 'ok'; b.t1 = ev[2]; }
      } else if (kind === 'pre') {
        const [, , id, tool, target, t0, agent] = ev;
        const cat = catOf(tool).key;
        const isFile = FILE_TOOLS.has(tool) && target.includes('/');
        const blip = { id, tool, target: isFile ? target.split('/').slice(-2).join('/') : target, isAgent: agent === 1, status: 'run', t0 };
        byId.set(id, blip);
        list.push(blip);
        m.calls += 1;
        m.byCat[cat] = (m.byCat[cat] || 0) + 1;
        if (isFile) {
          m.files = [...m.files.filter(f => f.path !== target), { path: target, op: cat === 'write' ? 'W' : 'R' }].slice(-12);
        }
      } else if (kind === 'post' || kind === 'fail') {
        const blip = byId.get(ev[2]);
        if (blip) {
          blip.status = kind === 'post' ? 'ok' : 'err';
          blip.t1 = ev[3];
        }
        if (kind === 'fail') m.errors += 1;
      }
    }
    // A session that died mid-turn leaves calls open; past a while, close them.
    if (now - lastAt > STALE_MS) {
      m.isThinking = false;
      for (const b of list) if (b.status === 'run') { b.status = 'err'; b.t1 = lastAt; }
    }
    return { list: list.slice(-80), m };
  }

  function render() {
    const now = Date.now();
    const { list, m } = build(now);
    const running = list.filter(b => b.status === 'run');
    isBusy = running.length > 0 || m.isThinking;
    $('await').style.display = 'none';
    $('live').hidden = false;
    $('hud').innerHTML = hudSvg(list, m, now);
    const rows = list.slice(-24).reverse();
    $('log').innerHTML = rows.length === 0
      ? '<div class="empty">Doom awaits his first command…</div>'
      : rows.map(b => {
          const isErr = b.status === 'err' || b.status === 'deny';
          const color = isErr ? MOLTEN : catOf(b.tool).color;
          return `<div class="row ${b.status === 'run' ? 'run' : isErr ? 'err' : 'ok'}">
            <span class="t">${escHtml(clock(b.t0))}</span>
            <span style="color:${color}">${escHtml(glyph(b.status))}</span>
            <span class="tool" style="color:${color}">${escHtml(shortTool(b.tool))}</span>
            <span class="target">${escHtml((b.isAgent ? '↳ ' : '') + b.target)}</span>
            <span class="dur">${b.status === 'run' ? 'live' : escHtml(dur(b, now))}</span></div>`;
        }).join('');
    const files = m.files.slice(-10).reverse();
    $('files').innerHTML = files.length === 0
      ? '<div class="empty">No files seized yet.</div>'
      : files.map(f => `<div class="file" style="color:${f.op === 'W' ? '#a3e635' : '#6ee7b7'}">${f.op === 'W' ? '⚒' : '◇'} ${escHtml(f.path)}</div>`).join('');
  }

  function showLink() {
    const el = $('link');
    if (events.length === 0) {
      el.className = '';
      el.textContent = 'LINK ▪ SEARCHING';
      $('await').style.display = 'flex';
      $('live').hidden = true;
      return;
    }
    const age = Date.now() - lastAt;
    if (isBusy) {
      el.className = 'live';
      el.textContent = 'LINK ▪ LIVE';
    } else if (age > STALE_MS) {
      el.className = 'lost';
      el.textContent = `LINK ▪ QUIET ▪ LAST SIGNAL ${ago(age)} AGO`;
    } else {
      el.className = '';
      el.textContent = `LINK ▪ IDLE ▪ LAST SIGNAL ${ago(age)} AGO`;
    }
  }

  function loaded() {
    events = incoming;
    incoming = [];
    const last = events[events.length - 1];
    lastAt = last ? last[last.length - 1 - (last[0] === 'pre' ? 1 : 0)] : 0;
    // Redraw on news, and every second while Claude works so timers run.
    if (events.length > 0 && (events.length !== shownCount || isBusy)) {
      shownCount = events.length;
      render();
    }
    showLink();
  }

  function poll() {
    incoming = [];
    const old = document.getElementById('feed');
    if (old) old.remove();
    const s = document.createElement('script');
    s.id = 'feed';
    s.src = `events.js?t=${Date.now()}`;
    s.onload = loaded;
    s.onerror = () => { incoming = []; loaded(); };
    document.body.appendChild(s);
  }

  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
