<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D.O.O.M.</title>
<style>
  :root {
    --bg: #010604;
    --green: #4ade80;
    --glow: #86efac;
    --dim: #5b6b60;
    --line: #14532d;
    --molten: #ff5a1f;
    --text: #d1d9d4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 50% 30%, #052414 0%, #020c06 55%, var(--bg) 100%),
      var(--bg);
    color: var(--text);
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(74, 222, 128, 0.035) 0 1px, transparent 1px 3px);
    z-index: 5;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  #hud svg { display: block; width: 100%; height: auto; border: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    position: relative;
    border: 1px solid var(--line);
    background: rgba(2, 10, 5, 0.85);
    padding: 10px 12px;
    min-width: 0;
  }
  .panel::before, .panel::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border: 1.5px solid var(--green);
  }
  .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  h2 {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--green);
    text-shadow: 0 0 6px rgba(74, 222, 128, 0.6);
  }
  .row { display: flex; gap: 8px; white-space: nowrap; }
  .row .t { color: var(--dim); }
  .row .tool { width: 9ch; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .row .target { flex: 1; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .row .dur { color: var(--dim); }
  .row.ok { opacity: 0.72; }
  .row.run .dur { color: var(--glow); animation: blink 1s infinite; }
  .row.err .target { color: var(--molten); }
  .file { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--dim); }
  #link {
    position: fixed;
    top: 10px;
    right: 14px;
    z-index: 6;
    font-size: 10px;
    letter-spacing: 0.18em;
    padding: 3px 8px;
    border: 1px solid var(--line);
    background: rgba(1, 6, 4, 0.8);
    color: var(--dim);
  }
  #link.live { color: var(--glow); border-color: var(--green); box-shadow: 0 0 8px rgba(74, 222, 128, 0.35); }
  #link.lost { color: var(--molten); border-color: var(--molten); }
  #await {
    display: none;
    min-height: 90vh;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 22px;
    text-align: center;
  }
  .reactor {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, #f0fff5 0 12%, var(--glow) 22%, rgba(74, 222, 128, 0.35) 45%, transparent 70%);
    box-shadow: 0 0 60px rgba(74, 222, 128, 0.35);
    position: relative;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .reactor::after {
    content: "";
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 2px dashed var(--green);
    opacity: 0.6;
    animation: spin 12s linear infinite;
  }
  .title { font: 300 28px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.4em; color: var(--glow); text-shadow: 0 0 12px rgba(134, 239, 172, 0.6); }
  .sub { color: var(--dim); letter-spacing: 0.15em; font-size: 11px; max-width: 46ch; }
  @keyframes pulse { 50% { transform: scale(0.94); opacity: 0.8; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 50% { opacity: 0.35; } }
</style>
</head>
<body>
<div id="link">LINK ▪ SEARCHING</div>

<section id="await">
  <div class="reactor"></div>
  <div class="title">D.O.O.M.</div>
  <div class="sub">AWAITING LINK. START A CLAUDE CODE SESSION ON THIS COMPUTER AND ITS ACTIVITY WILL APPEAR HERE.</div>
</section>

<main id="live" hidden>
  <div id="hud"></div>
  <div class="grid">
    <section class="panel">
      <h2>▌LEDGER OF DOOM</h2>
      <div id="log"></div>
    </section>
    <section class="panel">
      <h2>▌SEIZED TERRITORY</h2>
      <div id="files"></div>
    </section>
  </div>
</main>

<script>
  // feed.js, written beside this page by the doom-interface mod, calls
  // __doomFeed with the latest HUD. Loading it as a script works from a
  // file:// page, where fetch does not.
  const $ = id => document.getElementById(id);
  let last = null;
  let shownVersion = -1;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const ago = ms => {
    const s = Math.round(ms / 1000);
    return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}m` : `${Math.round(s / 3600)}h`;
  };

  window.__doomFeed = data => {
    last = data;
    if (data.v === shownVersion) return;
    shownVersion = data.v;
    $('await').style.display = 'none';
    $('live').hidden = false;
    $('hud').innerHTML = data.svg;
    $('log').innerHTML = data.log.length === 0
      ? '<div class="empty">Doom awaits his first command…</div>'
      : data.log.map(r => `<div class="row ${r.isRun ? 'run' : r.isErr ? 'err' : 'ok'}">
          <span class="t">${esc(r.time)}</span>
          <span style="color:${esc(r.color)}">${esc(r.glyph)}</span>
          <span class="tool" style="color:${esc(r.color)}">${esc(r.tool)}</span>
          <span class="target">${esc(r.target)}</span>
          <span class="dur">${esc(r.dur)}</span></div>`).join('');
    $('files').innerHTML = data.files.length === 0
      ? '<div class="empty">No files seized yet.</div>'
      : data.files.map(f => `<div class="file" style="color:${f.op === 'W' ? '#a3e635' : '#6ee7b7'}">${f.op === 'W' ? '⚒' : '◇'} ${esc(f.path)}</div>`).join('');
  };

  function showLink() {
    const el = $('link');
    if (last === null) {
      el.className = '';
      el.textContent = 'LINK ▪ SEARCHING';
      $('await').style.display = 'flex';
      return;
    }
    const age = Date.now() - last.at;
    if (last.isBusy && age > 30000) {
      el.className = 'lost';
      el.textContent = `SIGNAL LOST ▪ ${ago(age)} AGO`;
    } else if (last.isBusy) {
      el.className = 'live';
      el.textContent = 'LINK ▪ LIVE';
    } else {
      el.className = '';
      el.textContent = `LINK ▪ IDLE ▪ LAST SIGNAL ${ago(age)} AGO`;
    }
  }

  function poll() {
    const old = document.getElementById('feed');
    if (old) old.remove();
    const s = document.createElement('script');
    s.id = 'feed';
    s.src = `feed.js?t=${Date.now()}`;
    s.onload = s.onerror = showLink;
    document.body.appendChild(s);
  }

  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
